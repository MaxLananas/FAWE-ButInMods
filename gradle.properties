# ---------------------------------------------------------------------------
# FAWE-BIM — target platform
# ---------------------------------------------------------------------------
# Minecraft 1.21.10 / Fabric.  These are the exact versions WorldEdit 7.3.17
# (the reference release this port is based on) uses for 1.21.10.
org.gradle.jvmargs=-Xmx2G

mod_version=1.0.0
java_version=21

minecraft_version=1.21.10
fabric_loader_version=0.17.3
fabric_api_version=0.136.0+1.21.10

parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

# Loom reads its own loom_* properties from here, and an empty one is a value it
# cannot parse: point the build at a mirror in ~/.gradle/gradle.properties
# instead of leaving a blank line for it in this file.
