# ---------------------------------------------------------------------------
# FAWE-BIM — target platform
# ---------------------------------------------------------------------------
# Minecraft 26.2 / Fabric, the versions the Fabric example mod for 26.2 uses.
# Since 26.1 the game ships unobfuscated: there are no mappings to declare and
# no mod-prefixed dependency configurations, so this file names the game, the
# loader, the API, Mod Menu and the Java release, and nothing else.
org.gradle.jvmargs=-Xmx2G

# A byte of build output is worth keeping: the two projects are compiled in
# parallel, and a task whose inputs did not change is taken from the local build
# cache instead of run again.  Both are what makes a warm CI run short.
org.gradle.caching=true
org.gradle.parallel=true
# The build runs once and ends: watching the file system would only cost a
# thread.  (A local build wants the opposite, so this is set for CI below.)
org.gradle.vfs.watch=false

mod_version=1.2.0
java_version=25

minecraft_version=26.2
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
# Mod Menu is a soft dependency: the mod only needs it to appear in its list.
modmenu_version=20.0.3

# The Loom release is pinned in fabric/build.gradle.kts, where a plugin id can
# carry its version: `net.fabricmc.fabric-loom` is the plugin that reads an
# unobfuscated Minecraft, while the old `fabric-loom` id only knows obfuscated
# versions and remapping.

# Loom reads its own loom_* properties from here, and an empty one is a value it
# cannot parse: point the build at a mirror in ~/.gradle/gradle.properties
# instead of leaving a blank line for it in this file.
