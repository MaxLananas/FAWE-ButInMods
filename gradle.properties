# ---------------------------------------------------------------------------
# FAWE-BIM — target platform
# ---------------------------------------------------------------------------
# Minecraft 1.21.10 / Fabric.  These are the exact versions WorldEdit 7.3.17
# (the reference release this port is based on) uses for 1.21.10.
org.gradle.jvmargs=-Xmx2G

# A byte of build output is worth keeping: the two projects are compiled in
# parallel, and a task whose inputs did not change is taken from the local
# build cache instead of run again.  Both are what makes a warm CI run short.
org.gradle.caching=true
org.gradle.parallel=true
# The build runs once and ends: watching the file system would only cost a
# thread.  (A local build wants the opposite, so this is set for CI below.)
org.gradle.vfs.watch=false

mod_version=1.2.1
java_version=21

minecraft_version=1.21.10
fabric_loader_version=0.17.3
fabric_api_version=0.136.0+1.21.10
# Mod Menu is a soft dependency: the mod only needs it to appear in its list.
modmenu_version=16.0.1

parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

# Loom reads its own loom_* properties from here, and an empty one is a value it
# cannot parse: point the build at a mirror in ~/.gradle/gradle.properties
# instead of leaving a blank line for it in this file.
