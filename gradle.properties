# ---------------------------------------------------------------------------
# FAWE-BIM — target platform
# ---------------------------------------------------------------------------
# Minecraft 26.2 / Fabric.  These are the versions the Fabric example mod for
# 26.2 uses, plus the Loom line that ships the unobfuscated (26.1+) toolchain:
# Minecraft is no longer obfuscated, so there are no mappings to declare and no
# mod-prefixed dependency configurations.
org.gradle.jvmargs=-Xmx2G

mod_version=1.2.0
java_version=25

minecraft_version=26.2
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
# Mod Menu is a soft dependency: the mod only needs it to appear in its list.
modmenu_version=20.0.3

# The Loom that reads an unobfuscated Minecraft (26.1 and newer).  The old
# `fabric-loom` plugin only handles obfuscated versions and remapping.
loom_version=1.19.1

# Loom reads its own loom_* properties from here, and an empty one is a value it
# cannot parse: point the build at a mirror in ~/.gradle/gradle.properties
# instead of leaving a blank line for it in this file.
