<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="FAWE-BIM — the WorldEdit and FastAsyncWorldEdit command set as a Fabric mod for Minecraft 26.2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#0d1530"/><stop offset="1" stop-color="#0a1a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#3fd8ff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#3fd8ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fe9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26c6ff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M40 0H0V40" fill="none" stroke="#3fd8ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="26" fill="url(#glow)"/>

  <!-- isometric voxel cluster, right side -->
  <g transform="translate(900 252) scale(0.94)" opacity="0.96">
    <path d="M0 0 L150 -86 L300 0 L150 86 Z" fill="#0e2136" stroke="#1d4f6b" stroke-width="1.6" stroke-opacity="0.9"/>
    <g stroke="#0a1626" stroke-width="1.4" stroke-opacity="0.85">
      <path d="M34 19 L34 -29 L84 -58 L84 -10 Z" fill="#1b3f5c"/>
      <path d="M84 -58 L134 -29 L134 19 L84 -10 Z" fill="#122c42"/>
      <path d="M84 -58 L34 -29 L84 0 L134 -29 Z" fill="#2b6f92"/>
      <path d="M112 63 L112 15 L162 -14 L162 34 Z" fill="#1b3f5c"/>
      <path d="M162 -14 L212 15 L212 63 L162 34 Z" fill="#122c42"/>
      <path d="M162 -14 L112 15 L162 44 L212 15 Z" fill="#2b6f92"/>
      <path d="M196 20 L196 -60 L246 -89 L246 -9 Z" fill="#1b3f5c"/>
      <path d="M246 -89 L296 -60 L296 20 L246 -9 Z" fill="#122c42"/>
      <path d="M246 -89 L196 -60 L246 -31 L296 -60 Z" fill="#3fd8ff" fill-opacity="0.5"/>
    </g>
    <g fill="none" stroke="#7ff0ff" stroke-width="2">
      <path d="M186 -100 L246 -135 L306 -100 L306 -2 L246 33 L186 -2 Z" stroke-dasharray="9 6"/>
      <path d="M186 -100 L246 -65 L306 -100" opacity="0.55"/>
      <path d="M246 -65 L246 33" opacity="0.55"/>
    </g>
    <path d="M186 -100 L246 -135 L306 -100 L306 -2 L246 33 L186 -2 Z" fill="#7ff0ff" opacity="0.07"/>
  </g>

  <!-- wordmark block, kept clear of the cluster (x <= 860) -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="19" font-weight="600" letter-spacing="7" fill="#5fd6ff">FABRIC MOD · MINECRAFT 26.2</text>
    <text x="68" y="196" font-size="88" font-weight="800" letter-spacing="-1.5" fill="url(#word)">FAWE-BIM</text>
    <rect x="72" y="216" width="86" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="72" y="256" font-size="21" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" fill="#c7d5e6">WorldEdit 7.4 + FastAsyncWorldEdit · 255/255 names</text>
    <text x="72" y="290" font-size="17" fill="#8ea1b8">A buffered engine in FAWE's style: palette-packed sections,</text>
    <text x="72" y="316" font-size="17" fill="#8ea1b8">bulk chunk writes, deferred lighting — undo that costs megabytes.</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(72 330)">
      <rect width="176" height="0" fill="none"/>
    </g>
    <g transform="translate(742 58)">
      <rect width="176" height="32" rx="16" fill="#0d2334" stroke="#1f5a75"/>
      <text x="88" y="21" fill="#8fe6ff" text-anchor="middle">zero client mod</text>
    </g>
    <g transform="translate(936 58)">
      <rect width="196" height="32" rx="16" fill="#161028" stroke="#4b3a86"/>
      <text x="98" y="21" fill="#c4b5fd" text-anchor="middle">GPL-3.0 · audited</text>
    </g>
  </g>
</svg>
