<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-label="How a 16x16x16 section is stored: palette, state index, bit-packed longs with a per-cell written bitset, and one int per history row">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/><stop offset="1" stop-color="#0c1a2b"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6f92"/><stop offset="1" stop-color="#1a3f57"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="530" rx="22" fill="url(#sbg)"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="36" y="46" font-size="14" font-weight="700" letter-spacing="4" fill="#5fd6ff">ONE 16³ SECTION · 4096 CELLS · 1 TO 16 BITS PER CELL</text>
    <text x="36" y="72" font-size="13" fill="#7d90a8">A palette of states, an open-addressed index beside it, and cells that never straddle two longs.</text>
  </g>

  <!-- isometric 16^3 hint -->
  <g transform="translate(56 116)">
    <path d="M0 40 L92 6 L184 40 L184 156 L92 190 L0 156 Z" fill="#0e2033" stroke="#1d4f6b" stroke-width="2"/>
    <path d="M0 40 L92 74 L184 40" fill="none" stroke="#1d4f6b" stroke-width="1.5"/>
    <path d="M92 74 L92 190" fill="none" stroke="#1d4f6b" stroke-width="1.5"/>
    <g fill="url(#cell)" stroke="#0a1926" stroke-width="1">
      <path d="M20 52 L56 38 L92 52 L56 66 Z"/><path d="M56 66 L92 52 L128 66 L92 80 Z"/>
      <path d="M20 78 L56 64 L92 78 L56 92 Z"/><path d="M92 80 L128 66 L164 80 L128 94 Z"/>
      <path d="M56 92 L92 78 L128 92 L92 106 Z" opacity="0.75"/>
      <path d="M20 104 L56 90 L92 104 L56 118 Z" opacity="0.55"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7d90a8">
      <text x="0" y="222">index = (y &amp; 15) &lt;&lt; 8 | (z &amp; 15) &lt;&lt; 4 | (x &amp; 15)</text>
    </g>
  </g>

  <!-- palette -->
  <g transform="translate(360 116)">
    <rect width="228" height="176" rx="14" fill="#0d1a2a" stroke="#1d3c52"/>
    <text x="18" y="30" font-size="13" font-weight="700" letter-spacing="2" fill="#5fd6ff">PALETTE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c7d5e6">
      <text x="18" y="58">[0] minecraft:air</text>
      <text x="18" y="82">[1] minecraft:stone</text>
      <text x="18" y="106">[2] oak_log[axis=y]</text>
      <text x="18" y="130">[3] glass</text>
      <text x="18" y="158" fill="#5b708c">last write cached:</text>
      <text x="18" y="176" fill="#5b708c">a run repeats its state</text>
    </g>
  </g>

  <!-- index -->
  <g transform="translate(612 116)">
    <rect width="200" height="176" rx="14" fill="#0d1a2a" stroke="#1d3c52"/>
    <text x="18" y="30" font-size="13" font-weight="700" letter-spacing="2" fill="#5fd6ff">STATE INDEX</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c7d5e6">
      <text x="18" y="58">state+1 → slot</text>
      <text x="18" y="82" fill="#8fe6ff">7919 → 0</text>
      <text x="18" y="106" fill="#8fe6ff">3924 → 1</text>
      <text x="18" y="134" fill="#5b708c">open addressing,</text>
      <text x="18" y="152" fill="#5b708c">no boxing, no walk</text>
      <text x="18" y="176" fill="#5b708c">262–294M lookups/s</text>
    </g>
  </g>

  <!-- bit packing -->
  <g transform="translate(36 372)">
    <text x="0" y="-14" font-size="13" font-weight="700" letter-spacing="2" fill="#5fd6ff">ONE LONG · bitsPerBlock = 12</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <rect x="0" y="0" width="90" height="34" rx="6" fill="#14405a" stroke="#2b7d9e"/><text x="45" y="22" fill="#bff3ff" text-anchor="middle">cell 0</text>
      <rect x="92" y="0" width="90" height="34" rx="6" fill="#14405a" stroke="#2b7d9e"/><text x="137" y="22" fill="#bff3ff" text-anchor="middle">cell 1</text>
      <rect x="184" y="0" width="90" height="34" rx="6" fill="#14405a" stroke="#2b7d9e"/><text x="229" y="22" fill="#bff3ff" text-anchor="middle">cell 2</text>
      <rect x="276" y="0" width="90" height="34" rx="6" fill="#14405a" stroke="#2b7d9e"/><text x="321" y="22" fill="#bff3ff" text-anchor="middle">cell 3</text>
      <rect x="368" y="0" width="90" height="34" rx="6" fill="#14405a" stroke="#2b7d9e"/><text x="413" y="22" fill="#bff3ff" text-anchor="middle">cell 4</text>
      <rect x="460" y="0" width="24" height="34" rx="6" fill="#0f2233" stroke="#1d3c52"/><text x="472" y="22" fill="#4f6480" text-anchor="middle">—</text>
      <text x="0" y="54" fill="#4f6480">slot = (index × reciprocal) &gt;&gt; 32</text>
      <text x="0" y="72" fill="#4f6480">offset = (index − slot × perLong) × bits</text>
    </g>
  </g>

  <!-- written bitset -->
  <g transform="translate(556 372)">
    <rect width="448" height="86" rx="12" fill="#0d1a2a" stroke="#1d3c52"/>
    <text x="16" y="26" font-size="12" font-weight="700" letter-spacing="2" fill="#c4b5fd">WRITTEN BITSET</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c7d5e6">
      <text x="16" y="50">64 words × 64 bits = 1 bit per cell.</text>
      <text x="16" y="70">A flush walks the set bits, not 4096 cells.</text>
    </g>
  </g>

  <!-- history row -->
  <g transform="translate(36 500)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="0" y="0" fill="#7d90a8">history row, one int per changed cell:</text>
    <text x="256" y="0" fill="#8fe6ff">[ state 20 bits ][ cell 12 bits ]</text>
    <text x="536" y="0" fill="#7d90a8">→ 16 KB per filled section, ~4 MB per million blocks</text>
  </g>
</svg>
