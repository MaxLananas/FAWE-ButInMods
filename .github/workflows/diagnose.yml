name: Diagnose

# Temporary workflow: the build logs of the regular run cannot be read from the
# environment this branch is developed in, so the same two Gradle invocations are
# repeated here and their output is attached to the check run as annotations.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test, reporting the output as annotations
        run: |
          set +e
          ./gradlew --no-daemon :core:verify > /tmp/core.log 2>&1
          core=$?
          ./gradlew --no-daemon :fabric:compileJava > /tmp/fabric.log 2>&1
          fabric=$?
          echo "core verify exit: $core, fabric compile exit: $fabric"
          python3 -c "import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text(errors='replace')[-28000:]; print('::error title='+sys.argv[2]+'::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))" /tmp/core.log "core verify"
          python3 -c "import pathlib,sys; t=pathlib.Path(sys.argv[1]).read_text(errors='replace')[-28000:]; print('::error title='+sys.argv[2]+'::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))" /tmp/fabric.log "fabric compile"
          if [ "$core" -ne 0 ] || [ "$fabric" -ne 0 ]; then exit 1; fi
