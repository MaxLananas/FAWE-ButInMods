name: Diagnose

# Temporary workflow: the build logs of the regular run cannot be read from the
# environment this branch is developed in. This run compiles both modules, keeps
# the full logs as an artifact and prints the API of the mapped game, so the
# adapter sources can be brought in line with the exact target version.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile the fabric module and report the errors
        run: |
          set +e
          ./gradlew --no-daemon :fabric:compileJava > /tmp/fabric.log 2>&1
          fabric=$?
          echo "fabric compile exit: $fabric"
          python3 -c "import pathlib,sys; t=pathlib.Path('/tmp/fabric.log').read_text(errors='replace')[-20000:]; print('::error title=fabric compile::'+t.replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))"
          exit 0

      - name: Print the API of the mapped game
        run: python3 scripts/ci_probe.py

      - name: Keep the logs and the API dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: |
            /tmp/fabric.log
            probe.txt
          if-no-files-found: warn
