name: Build

# Quota-minimal CI for FAWE-BIM:
# - Never runs on schedule (zero idle runner minutes).
# - Never runs on feature/arena branch pushes or on Horizon/docs/tooling-only changes.
# - Runs only on:
#     1) `v*` tags (builds, smoke-tests, and publishes the GitHub Release jar),
#     2) pushes / PRs to `26.3` that actually touch Java/Fabric/Gradle sources,
#     3) manual `workflow_dispatch`.
# - Uploads zero workflow artifacts and creates zero Actions caches.
on:
  push:
    branches: ['26.3']
    tags: ['v*']
    paths:
      - 'core/**'
      - 'fabric/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  pull_request:
    branches: ['26.3']
    paths:
      - 'core/**'
      - 'fabric/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, boot the mod and release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile, run engine self-tests and build jar
        run: |-
          start=$(date +%s)
          ./gradlew --no-daemon --parallel build :core:verify 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "::notice title=build time::compiled, tested and jarred in $(( $(date +%s) - start ))s"
          summary=$(grep -a 'Self-tests:' /tmp/build.log | tail -1 || true)
          if [ -n "$summary" ]; then
            echo "::notice title=engine self-tests::$summary"
          fi
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/build.log
          fi
          exit "$status"

      - name: Check the jar carries the nested core engine
        run: |
          jar=$(ls fabric/build/libs/*.jar | grep -v -- -sources | head -1)
          echo "built $jar"
          unzip -l "$jar" | grep -q 'META-INF/jars/'

      - name: Dedicated server RCON smoke test
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |-
          mkdir -p fabric/run
          printf '%s\n' 'eula=true' > fabric/run/eula.txt
          printf '%s\n' \
            'enable-rcon=true' \
            'rcon.port=25575' \
            'rcon.password=fawebim' \
            'online-mode=false' \
            'level-type=minecraft:flat' \
            'level-name=world' \
            'spawn-protection=0' \
            'view-distance=3' \
            'simulation-distance=3' \
            'max-players=2' \
            'sync-chunk-writes=false' \
            'pause-when-empty-seconds=0' \
            'motd=FAWE-BIM smoke test' > fabric/run/server.properties

          nohup ./gradlew --no-daemon :fabric:runServer > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          trap 'kill "$(cat /tmp/server.pid)" 2>/dev/null || true; pkill -f net.fabricmc.devlaunchinjector 2>/dev/null || true' EXIT

          for i in $(seq 1 180); do
            if grep -q 'Done (' /tmp/server.log; then
              break
            fi
            if ! kill -0 "$(cat /tmp/server.pid)" 2>/dev/null; then
              tail -c 6000 /tmp/server.log
              exit 1
            fi
            sleep 1
          done

          python3 - <<'PY'
          import socket, struct, sys, time

          def packet(request_id, kind, body):
              payload = struct.pack('<ii', request_id, kind) + body.encode('utf8') + b'\x00\x00'
              return struct.pack('<i', len(payload)) + payload

          def read(sock):
              raw = sock.recv(4)
              if len(raw) < 4:
                  return None, None
              (length,) = struct.unpack('<i', raw)
              data = b''
              while len(data) < length:
                  chunk = sock.recv(length - len(data))
                  if not chunk:
                      break
                  data += chunk
              ident, _kind = struct.unpack('<ii', data[:8])
              return ident, data[8:-2].decode('utf8', 'replace')

          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  sock = socket.create_connection(('127.0.0.1', 25575), timeout=10)
                  break
              except OSError:
                  time.sleep(1)
          else:
              sys.exit('rcon never answered')

          sock.sendall(packet(1, 3, 'fawebim'))
          ident, _ = read(sock)
          if ident == -1:
              sys.exit('rcon refused the password')

          def command(text):
              sock.sendall(packet(2, 2, text))
              return read(sock)[1]

          version = command('we version')
          if '26.3' not in version:
              sys.exit('unexpected version: ' + version)
          command('//pos1 0,0,0')
          command('//pos2 15,15,15')
          command('//set stone')
          command('//count stone')
          command('stop')
          PY

          grep 'FAWE-BIM ready' /tmp/server.log
          if grep -E 'FAWE-BIM failed to start|Mixin apply failed|MixinApplyError|NoSuchFieldError|NoSuchMethodError' /tmp/server.log; then
            exit 1
          fi

      - name: Publish the release and attach the jar
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -eu
          jar=$(ls fabric/build/libs/*.jar | grep -v -- -sources | head -1)
          title="FAWE-BIM ${TAG#v} — Minecraft 26.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
          else
            gh release create "$TAG" "$jar" --title "$title" --notes-file CHANGELOG.md --verify-tag
          fi
