name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a new push cancels the older, still-queued or still-running
# build of the same branch, so the newest jar is always the one being verified.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Engine, tests and mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.x runs on Java 25 and its class files are major version 69:
      # the toolchain here is the one the game itself needs.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the engine tests and the command inventory check
        run: |-
          ./gradlew --no-daemon :core:verify 2>&1 | tee /tmp/verify.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The log lives behind a signed URL the run page can reach; the
            # annotation keeps the reason visible where the checks are listed.
            tail -c 3000 /tmp/verify.log | python3 -c "import sys; print('::error title=core verify::' + sys.stdin.read().replace('%', '%25').replace(chr(10), '%0A').replace(chr(13), '%0D'))"
          fi
          exit "$status"

      - name: Build the mod
        run: |-
          ./gradlew --no-daemon build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Same reason as the engine step above: the log itself is behind a
            # signed URL, the annotation is what the run page shows.
            tail -c 6000 /tmp/build.log | python3 -c "import sys; print('::error title=mod build::' + sys.stdin.read().replace('%', '%25').replace(chr(10), '%0A').replace(chr(13), '%0D'))"
          fi
          exit "$status"

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: FAWE-BIM
          path: fabric/build/libs/*.jar
          if-no-files-found: warn
