name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Nothing is uploaded any more: an artifact costs the account's storage quota
  # and no job ever downloaded this one. What is left to do is delete the ones
  # the old workflow produced, which needs this permission.
  actions: write

# One run per branch: a new push cancels the older, still-queued or still-running
# build of the same branch, so the newest jar is always the one being verified.
# The group is the branch, not the ref: a pull request and the push that
# opened it share it, so a branch with an open pull request is built once and
# not twice.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and boot the mod
    runs-on: ubuntu-latest
    # A green run is about two minutes; anything near this is a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Minecraft 1.21.10 runs on Java 21: the toolchain here is the one the
      # game itself needs. setup-java caches the Gradle user home itself, which
      # is what makes a warm run short.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The whole Gradle home: the downloads, the compiled Kotlin build scripts,
      # the build cache and Loom's extracted game. Narrowing it to the downloads
      # alone cost forty seconds a run, which is what the build scripts are
      # compiled for. The key is the hash of the files that decide the toolchain,
      # so this cache is written once and restored afterwards: setup-gradle's
      # cache has a key per run and is *saved* at the end of every job, and that
      # save alone took sixty seconds, more than the build it cached.
      - name: Cache the Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            fabric/.gradle
          key: gradle-home-v1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle.kts', 'build.gradle.kts', 'core/build.gradle.kts', 'fabric/build.gradle.kts') }}
          restore-keys: |
            gradle-home-v1-

      # One invocation, not two: `build` and `:core:verify` in the same JVM
      # means one Gradle start, one configuration phase and one dependency
      # resolution.
      - name: Compile, run the engine tests and build the jar
        run: |-
          start=$(date +%s)
          ./gradlew --no-daemon --parallel --build-cache build :core:verify 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "::notice title=build time::compiled, tested and jarred in $(( $(date +%s) - start ))s"
          if [ "$status" -ne 0 ]; then
            # The log lives behind a signed URL the run page can reach; the
            # annotation keeps the reason visible where the checks are listed.
            tail -c 6000 /tmp/build.log | python3 -c "import sys; print('::error title=build::' + sys.stdin.read().replace('%', '%25').replace(chr(10), '%0A').replace(chr(13), '%0D'))"
          fi
          exit "$status"

      # The mod jar has to carry the engine: the core is included as a nested
      # jar (jar-in-jar) rather than merged, which is what the loader reads.
      - name: Check the jar carries the engine
        run: |
          jar=$(ls fabric/build/libs/*.jar | grep -v -- -sources | head -1)
          echo "built $jar"
          unzip -l "$jar" | tail -3
          if ! unzip -l "$jar" | grep -q 'META-INF/jars/'; then
            echo "::error title=the jar has no nested engine::the core jar is missing from $jar"
            exit 1
          fi

      # The static audit: the defect classes that have bitten this project, or
      # that a reviewer of a 60k-line port has to check by hand otherwise. It
      # reads the sources and prints one line per hit.
      - name: Audit the sources
        run: |
          python3 tools/audit.py --summary || true

      # A jar that compiles is not a mod that runs: the mixin has to apply, the
      # access widener has to name members that still exist, the commands have to
      # reach the dispatcher and the registries have to be read. This boots the
      # game with the mod in it, drives it over rcon and fails on the first
      # exception in the log. It runs in the same job as the build, on the same
      # runner, so there is no second checkout, no second JDK and no artifact
      # between the two - and nothing to delete afterwards.
      - name: Prepare the server directory
        run: |
          mkdir -p fabric/run
          printf '%s\n' 'eula=true' > fabric/run/eula.txt
          printf '%s\n' \
            'enable-rcon=true' \
            'rcon.port=25575' \
            'rcon.password=fawebim' \
            'online-mode=false' \
            'level-type=minecraft:flat' \
            'level-name=world' \
            'spawn-protection=0' \
            'view-distance=3' \
            'simulation-distance=3' \
            'max-players=2' \
            'sync-chunk-writes=false' \
            'pause-when-empty-seconds=0' \
            'motd=FAWE-BIM smoke test' > fabric/run/server.properties

      - name: Start the dedicated server
        run: |-
          start=$(date +%s)
          nohup ./gradlew --no-daemon :fabric:runServer > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 180); do
            if grep -q 'Done (' /tmp/server.log; then
              echo "::notice title=server boot::the server was up in $(( $(date +%s) - start ))s"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/server.pid)" 2>/dev/null; then
              echo "the server stopped before it was ready"
              break
            fi
            sleep 1
          done
          echo "the server did not come up"
          tail -c 6000 /tmp/server.log
          exit 1

      # The command surface, driven on the running game: hundreds of commands,
      # their combinations and their refusals. It is the sweep that finds the
      # bugs the engine's own suite cannot see, because it runs against the
      # real registries and the real chunks.
      - name: Drive the commands over rcon
        run: |-
          set +e
          python3 tools/rcon_matrix.py --wait 180 --log /tmp/server.log 2>&1 | tee /tmp/matrix.log
          status=${PIPESTATUS[0]}
          python3 -c "import pathlib;t=pathlib.Path('/tmp/matrix.log').read_text(errors='replace')[-7000:];print('::error title=rcon matrix::'+t.replace('%','%25').replace(chr(10),'%0A'))"
          exit $status

      - name: Check the mod's own start line and fail on an exception
        run: |-
          grep 'FAWE-BIM ready' /tmp/server.log
          if grep -E 'FAWE-BIM failed to start|Mixin apply failed|MixinApplyError|NoSuchFieldError|NoSuchMethodError' /tmp/server.log; then
            echo "::error title=the mod did not start cleanly::see the log above"
            exit 1
          fi
          # An exception in the log is a bug even when the command that caused
          # it answered politely: the sweep says what went wrong. The lines
          # around the first one are printed, because the answer of the sweep
          # alone does not say which command it was.
          if grep -nE '^\s*(at |Caused by:)' /tmp/server.log | head -3; then
            # The lines around the first stack trace go into the message of the
            # annotation: the output of a step that fails is not readable from
            # the run page, the annotation is.
            line=$(grep -nE '^\s*(at |Caused by:)' /tmp/server.log | head -1 | cut -d: -f1)
            start=$(( line > 15 ? line - 15 : 1 ))
            excerpt=$(sed -n "${start},$(( line + 10 ))p" /tmp/server.log | head -25)
            echo "::error title=the server logged an exception::$(echo "$excerpt" | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi

      - name: Stop the server
        if: always()
        run: |
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          sleep 2
          pkill -f net.fabricmc.devlaunchinjector 2>/dev/null || true

      - name: Report the server log
        if: failure()
        run: |
          python3 -c "import pathlib;t=pathlib.Path('/tmp/server.log').read_text(errors='replace')[-7000:];print('::error title=server log::'+t.replace('%','%25').replace(chr(10),'%0A'))"

  # Nothing in this repository is worth keeping between runs: the jar is built
  # again in a minute, and an artifact costs the account's storage quota for
  # ninety days by default. This job deletes every artifact the repository still
  # holds, which is how the ones the old two-job workflow uploaded are cleared,
  # and it keeps the repository at zero for ever after.
  purge-artifacts:
    name: Delete every artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete the artifacts of this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          total=0
          while true; do
            ids=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
                    -q '.artifacts[].id' 2>/dev/null || true)
            if [ -z "$ids" ]; then
              break
            fi
            for id in $ids; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 \
                && total=$(( total + 1 )) || break 2
            done
          done
          echo "::notice title=artifacts::deleted $total artifact(s); the repository keeps none"
